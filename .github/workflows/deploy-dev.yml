name: Deploy DEV

on:
  push:
    branches: [main, migration/aws-platform]
  workflow_dispatch:

concurrency:
  group: groundtruth-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::025329968834:role/GroundTruthDevDeployRole
          aws-region: us-east-1
          role-session-name: groundtruth-dev-${{ github.run_id }}
      - name: Assume CDK deployment role for failed-stack recovery
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::025329968834:role/cdk-hnb659fds-deploy-role-025329968834-us-east-1
          aws-region: us-east-1
          role-chaining: true
          role-skip-session-tagging: true
          role-session-name: groundtruth-dev-recovery-${{ github.run_id }}
      - name: Remove failed initial DEV stack only
        shell: bash
        run: |
          status="$(aws cloudformation describe-stacks --stack-name GroundTruthLeadIntake-dev --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [[ "$status" == "ROLLBACK_COMPLETE" ]]; then
            aws cloudformation delete-stack --stack-name GroundTruthLeadIntake-dev
            aws cloudformation wait stack-delete-complete --stack-name GroundTruthLeadIntake-dev
          fi
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::025329968834:role/GroundTruthDevDeployRole
          aws-region: us-east-1
          role-session-name: groundtruth-dev-${{ github.run_id }}
      - run: npx cdk deploy --all --require-approval never -c environment=dev --outputs-file cdk-outputs.json
      - run: node scripts/smoke-test.mjs "$(node scripts/cloudfront-url.mjs cdk-outputs.json)"
